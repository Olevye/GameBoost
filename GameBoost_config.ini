; ========== GameBoost - Конфигурация ==========
; Редактируй этот файл под себя. После изменений перезапусти скрипт.

[Процессы]
; Процессы с МИНИМАЛЬНЫМ приоритетом (Discord и т.п.)
; Через запятую, без .exe
LowPriority=Discord,DiscordPTB,DiscordCanary,DiscordDevelopment,chrome,browser,comet

; Процессы с МАКСИМАЛЬНЫМ приоритетом (игры)
; Через запятую, без .exe
HighPriority=Rocket League,RocketLeague,csgo,cs2,Counter-Strike,Valorant,dota 2,dota2,FortniteClient-Win64,eldenring,GTA5,battlefield,Overwatch,apex,rustclient,League of Legends,Wow,Wow-64,Destiny2,Warframe

[Таймеры]
; Как часто проверять процессы (секунды)
ProcessCheckInterval=3
; Как часто проверять звук (секунды)
AudioCheckInterval=5
; Как часто проверять оптимизации (минуты, 0 = не проверять)
OptimizationCheckInterval=5

[Звук]
; Включить авто-восстановление звука (1=да, 0=нет)
FixAudio=1
; Перезапускать службу Windows Audio при краше (1=да, 0=нет)
RestartAudioService=1
; Дополнительно перезапускать аудио-endpoint (1=да, 0=нет)
RestartAudioEndpoint=1

[Оптимизации Windows]
; Применить при запуске и периодически проверять (1=да, 0=нет)
ApplyOptimizations=1
; Высокопроизводительная схема питания (1=да, 0=нет)
HighPerformancePower=1
; Игровой режим Windows (1=вкл, 0=выкл)
GameMode=1
; Отключить Nagle для игр (сеть) (1=да, 0=нет)
DisableNagle=1
; Таймер разрешения для игр (0.5ms) (1=да, 0=нет)
TimerResolution=1
; Приоритет фоновых служб: 0=программы, 1=фоновые (для игр лучше 0)
BackgroundServices=0
; Сетевые ограничения отключить (меньше пинг в играх) (1=да, 0=нет)
NetworkThrottling=1
; Аппаратное ускорение GPU планировщика Win10/11 (1=вкл, 0=выкл)
HardwareAccelGPU=1
; Отключить индексацию для игровых папок (1=применить, 0=нет)
DisableIndexing=0

[Лог]
; Писать лог в файл (1=да, 0=нет)
EnableLog=1
; Путь к логу (оставь пустым для папки скрипта)
LogPath=
